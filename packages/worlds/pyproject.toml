[project]
name = "research-worlds"
version = "0.1.0"
description = "Author tasks and evaluation; reuse the sandbox and execution infrastructure"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
harbor = ["harbor>=0.24.0"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worlds"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
harbor = { workspace = true }
